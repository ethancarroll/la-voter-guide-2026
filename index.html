<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14171f" media="(prefers-color-scheme: dark)" />
  <title>LA Voter Guide</title>
  <meta name="description" content="Interactive, non-partisan voter guide for Los Angeles ballots, with saved picks and a printable summary for your paper ballot." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <button class="topbar__home" id="homeBtn" aria-label="All elections">🗳️</button>
    <button class="topbar__title" id="electionBtn"></button>
    <div class="topbar__progress" aria-hidden="true">
      <div class="progress"><div class="progress__bar" id="progressBar"></div></div>
      <span class="topbar__count" id="progressCount"></span>
    </div>
    <button class="topbar__summary" id="gotoSummaryBtn">Summary</button>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <footer class="sitefoot">
    <p>Independent, non-partisan guide — not affiliated with any campaign, party or election office.
      Always verify with your official ballot and <a href="https://lavote.gov" target="_blank" rel="noopener">lavote.gov</a>.
      Your picks are saved only in your browser.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
